name: CI

# Run the pipeline on every push and on pull requests
on:
  push:
    branches: ["**"]        # any branch
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your repo's code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21 and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Make the Maven wrapper executable (needed on Linux runners)
      - name: Make mvnw executable
        run: chmod +x mvnw

      # 4. Build and run tests
      - name: Build and test
        run: ./mvnw --batch-mode clean verify
