name: CI

# WHEN this pipeline runs.
# - push:         every time you push commits to any branch
# - pull_request: every time a PR is opened or updated
on:
  push:
    branches: ["**"]        # "**" means any branch name
  pull_request:
    branches: ["**"]

jobs:
  # A "job" is one machine doing a sequence of steps. We have one job: "build".
  build:
    # The virtual machine GitHub gives us. A fresh Ubuntu Linux box each run.
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # 1. Get your code onto the runner.
      #    'uses:' pulls in a prebuilt, community/GitHub-maintained action.
      # ---------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      # ---------------------------------------------------------------------
      # 2. Install Java 21 (Temurin distribution) and cache Maven downloads.
      #    'cache: maven' saves ~/.m2 between runs so dependencies aren't
      #    re-downloaded every time -> much faster builds.
      # ---------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ---------------------------------------------------------------------
      # 3. The Maven wrapper script (mvnw) must be executable on Linux.
      #    Git may not preserve the +x permission, so we set it explicitly.
      # ---------------------------------------------------------------------
      - name: Make mvnw executable
        run: chmod +x mvnw

      # ---------------------------------------------------------------------
      # 4. Compile AND run the tests.
      #    'verify' runs the full lifecycle up to and including the test phase,
      #    then packages the jar. If ANY test fails, this step fails and the
      #    whole pipeline goes red -> the PR is blocked.
      #
      #    --batch-mode  : no interactive prompts, cleaner CI logs
      #    (no -DskipTests here: we WANT the tests to run now)
      # ---------------------------------------------------------------------
      - name: Build and test
        run: ./mvnw --batch-mode clean verify

      # ---------------------------------------------------------------------
      # 5. Keep the test reports even when tests fail, so you can open them
      #    from the GitHub Actions run page and see exactly what broke.
      #    'if: always()' runs this step whether step 4 passed or failed.
      # ---------------------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
