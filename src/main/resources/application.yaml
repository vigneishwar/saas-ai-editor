spring:
  application:
    name: saas-ai-editor

  # Defaults to 'local' for development; override in prod with SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas_ai}
    username: ${DB_USERNAME:vikki}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# NOTE: 'logging' is a top-level key, NOT nested under 'spring'.
logging:
  level:
    org.hibernate.tool.schema: ${LOG_HIBERNATE_SCHEMA:INFO}
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:INFO}

jwt:
  # No default on purpose: the app must fail fast if the secret isn't provided.
  # Supplied locally via application-local.yaml, in prod via the JWT_SECRET_KEY env var.
  secret-key: ${JWT_SECRET_KEY}
